<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="size" content="1000x640"><meta name="category" content="chart">
<style>
*{box-sizing:border-box}
body{margin:0;position:relative;display:flow-root;width:1000px;height:640px;background:#fff;font-family:'Segoe UI',Arial,sans-serif;color:#222;overflow:hidden}
h2{font-size:24px;margin:26px 40px 4px;font-weight:600}
.sub{margin:0 40px;color:#666;font-size:15px}
svg{position:absolute;left:0;top:0}
svg text{font-family:'Segoe UI',Arial,sans-serif}
.leg{position:absolute;right:40px;top:34px;display:flex;gap:18px;font-size:14px;color:#444}
.leg i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.src{position:absolute;left:40px;bottom:16px;font-size:12px;color:#888}
</style></head><body>
<h2 data-expect>Monthly active users by platform</h2>
<div class="sub" data-expect>Thousands of users, January to June 2025</div>
<div class="leg"><span data-expect><i style="background:#4e79a7"></i>Desktop app</span><span data-expect><i style="background:#f28e2b"></i>Mobile app</span><span data-expect><i style="background:#59a14f"></i>Web browser</span></div>
<svg width="1000" height="640" style="pointer-events:none">
<g font-size="13" fill="#666">
<line x1="100" x2="960" y1="540" y2="540" stroke="#999"/>
<line x1="100" x2="960" y1="455" y2="455" stroke="#eee"/><line x1="100" x2="960" y1="370" y2="370" stroke="#eee"/><line x1="100" x2="960" y1="285" y2="285" stroke="#eee"/><line x1="100" x2="960" y1="200" y2="200" stroke="#eee"/><line x1="100" x2="960" y1="115" y2="115" stroke="#eee"/>
<text x="88" y="545" text-anchor="end" data-expect>0 k</text><text x="88" y="460" text-anchor="end" data-expect>50 k</text><text x="88" y="375" text-anchor="end" data-expect>100 k</text><text x="88" y="290" text-anchor="end" data-expect>150 k</text><text x="88" y="205" text-anchor="end" data-expect>200 k</text><text x="88" y="120" text-anchor="end" data-expect>250 k</text>
</g>
<g id="bars"></g>
<text x="30" y="330" font-size="14" fill="#444" transform="rotate(-90 30 330)" text-anchor="middle" data-expect>Active users (thousands)</text>
<text x="530" y="592" font-size="14" fill="#444" text-anchor="middle" data-expect>Month of 2025</text>
</svg>
<div class="src" data-expect>Source: internal analytics, deduplicated by account</div>
<script>
const months=['January','February','March','April','May','June'],d=[[120,64,38],[126,71,41],[131,80,45],[129,92,52],[138,104,58],[142,118,61]],col=['#4e79a7','#f28e2b','#59a14f'];
let h='';d.forEach((v,i)=>{const x0=130+i*140;v.forEach((y,j)=>{const hh=y*1.7;h+=`<rect x="${x0+j*30}" y="${540-hh}" width="26" height="${hh}" fill="${col[j]}"/>`;});
h+=`<text x="${x0+42}" y="562" font-size="13" fill="#555" text-anchor="middle" data-expect>${months[i]}</text>`;
h+=`<text x="${x0+42}" y="${540-v[0]*1.7-8}" font-size="12" fill="#333" text-anchor="middle" data-expect>${v.reduce((a,b)=>a+b)}k total</text>`;});
document.getElementById('bars').innerHTML=h;
</script>
</body></html>
