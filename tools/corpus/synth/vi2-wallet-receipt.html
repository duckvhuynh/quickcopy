<!doctype html><html lang="vi"><head><meta charset="utf-8">
<meta name="size" content="1080x1900"><meta name="category" content="receipt-vi">
<style>
*{box-sizing:border-box}
html{zoom:2.5}
body{margin:0;width:432px;height:760px;background:#f6f0f4;font-family:Roboto,'Segoe UI',Arial,sans-serif;color:#303233;overflow:hidden}
.hd{background:#a50064;color:#fff;padding:34px 16px 60px;text-align:center}
.hd b{font-size:16px}
.card{background:#fff;margin:-44px 14px 12px;border-radius:14px;padding:18px 16px;text-align:center}
.ic{width:46px;height:46px;border-radius:50%;background:#e8f8ef;color:#1aa260;font-size:26px;line-height:46px;margin:0 auto 8px}
.st{color:#1aa260;font-weight:600;font-size:15px}
.amt{font-size:30px;font-weight:700;margin:6px 0}
.ds{font-size:14px;color:#727272}
.det{background:#fff;margin:0 14px;border-radius:14px;padding:6px 16px}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:10px 0;border-bottom:1px solid #f0f0f0}
.row:last-child{border:0}
.row .k{color:#727272}
.row .v{font-weight:500;text-align:right}
.pt{color:#a50064}
.btn{margin:16px 14px;background:#a50064;color:#fff;text-align:center;border-radius:10px;padding:12px;font-weight:600;font-size:15px}
</style></head><body>
<div class="hd"><b data-expect>Chi tiết giao dịch</b></div>
<div class="card"><div class="ic">✓</div><div class="st" data-expect>Giao dịch thành công</div><div class="amt" data-expect>-250.000đ</div><div class="ds" data-expect>Thanh toán hóa đơn tiền điện tháng 11</div></div>
<div class="det">
<div class="row"><span class="k" data-expect>Nhà cung cấp</span><span class="v" data-expect>Điện lực Cầu Giấy</span></div>
<div class="row"><span class="k" data-expect>Mã khách hàng</span><span class="v" data-expect>PD12000345678</span></div>
<div class="row"><span class="k" data-expect>Tên khách hàng</span><span class="v" data-expect>Đinh Thị Nguyệt</span></div>
<div class="row"><span class="k" data-expect>Thời gian</span><span class="v" data-expect>08:47 - 22/11/2026</span></div>
<div class="row"><span class="k" data-expect>Nguồn tiền</span><span class="v" data-expect>Ví điện tử</span></div>
<div class="row"><span class="k" data-expect>Tổng phí</span><span class="v" data-expect>Miễn phí</span></div>
<div class="row"><span class="k" data-expect>Điểm thưởng</span><span class="v pt" data-expect>+1.250 điểm</span></div>
</div>
<div class="btn" data-expect>Về trang chủ</div>
</body></html>
