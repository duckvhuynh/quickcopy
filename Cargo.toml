[package]
name = "quickcopy"
version = "0.1.0"
edition = "2024"
description = "Select and copy text inside any on-screen image (Live Text style) on Windows"

[dependencies]
# Loaded at runtime only for Vietnamese OCR: onnxruntime.dll next to the exe,
# or the copy Windows 11 ships in System32 (1.17, hence api-17).
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-17"] }
serde_json = "1.0.154"
windows ={ version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct2D",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
