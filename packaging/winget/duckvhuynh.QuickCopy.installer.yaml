# Template: docs/release.md fills __VERSION__ and __ZIP_SHA256__.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.10.0.schema.json
PackageIdentifier: duckvhuynh.QuickCopy
PackageVersion: __VERSION__
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: QuickCopy\quickcopy.exe
    PortableCommandAlias: quickcopy
# quickcopy.exe finds models\ next to itself; a symlink in winget's Links
# folder would point it at the wrong folder, so put the install folder on
# PATH instead.
ArchiveBinariesDependOnPath: true
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/duckvhuynh/quickcopy/releases/download/v__VERSION__/QuickCopy-__VERSION__-windows-x64.zip
    InstallerSha256: __ZIP_SHA256__
ManifestType: installer
ManifestVersion: 1.10.0
