    InstallerUrl: https://github.com/duckvhuynh/quickcopy/releases/download/v0.1.1/QuickCopy-0.1.1-windows-x64.zip
    InstallerSha256: 4A373BE7181952DACEF158666DE66CBFB6C2E5E5B147C13BD4D4A0AE423B5AF0
ManifestType: installer
ManifestVersion: 1.10.0
