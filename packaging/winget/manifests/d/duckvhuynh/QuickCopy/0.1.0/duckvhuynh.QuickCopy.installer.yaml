    InstallerUrl: https://github.com/duckvhuynh/quickcopy/releases/download/v0.1.0/QuickCopy-0.1.0-windows-x64.zip
    InstallerSha256: 41A6FF4944117B05ED7476BE4EF76851448D22C0085FC49BD1F1405665E1D8F1
ManifestType: installer
ManifestVersion: 1.10.0
